[package]
name = "danmuku-video-player"
version = "1.2.3"
description = "Danmuku Video Player 本地视频 + 弹幕播放器（桌面版）"
edition = "2021"

[lib]
name = "danmuku_video_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# PGS（蓝光位图字幕）：纯 Rust 的 MKV/SUP 抽取 + RLE 解码，按 Cues 索引只读字幕块
libpgs = "0.6"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
strip = true
