[package]
name = "danmuku-video-player"
version = "1.2.5"
description = "Danmuku Video Player 本地视频 + 弹幕播放器（桌面版）"
edition = "2021"

[lib]
name = "danmuku_video_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# PGS（蓝光位图字幕）：纯 Rust 的 MKV/SUP 抽取 + RLE 解码，按 Cues 索引只读字幕块
libpgs = "0.6"
png = "0.17"

# ffmpeg 子进程绑进 Job Object：父进程被强杀时内核连带杀掉它们，不留孤儿
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
strip = true
