<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Danmuku Video Player · 本地视频 + 弹幕播放器</title>
<style>
  :root {
    --accent: #fb7299;
    --bg: #111318;
    --card: #1a1d24;
    --line: #2a2e37;
    --text: #e8eaf0;
    --muted: #9aa1b0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(1100px 560px at 88% -12%, rgba(123, 92, 255, .16), transparent 62%),
      radial-gradient(900px 520px at -12% 28%, rgba(251, 114, 153, .10), transparent 60%),
      radial-gradient(1000px 680px at 50% 112%, rgba(0, 161, 214, .09), transparent 62%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap > * { animation: rise .55s cubic-bezier(.22, .8, .32, 1) both; }
  .wrap > *:nth-child(2) { animation-delay: .06s; }
  .wrap > *:nth-child(3) { animation-delay: .12s; }
  .wrap > *:nth-child(4) { animation-delay: .18s; }
  .wrap > *:nth-child(5) { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .wrap > * { animation: none; }
  }
  .wrap {
    height: 100vh; display: flex; flex-direction: column;
    padding: 14px 16px 16px;
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
  }
  .field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .chip {
    background: #232733; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--muted);
    max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .btn-folder {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, rgba(251, 114, 153, .16), rgba(123, 92, 255, .16));
    color: var(--text); border: 1px solid rgba(251, 114, 153, .45);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; font-family: inherit; cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .btn-folder:hover { transform: translateY(-1px); border-color: var(--accent); box-shadow: 0 6px 18px -8px rgba(251, 114, 153, .55); }
  .btn-folder:active { transform: translateY(0) scale(.98); }
  .playlist {
    position: fixed; top: 0; right: 0; bottom: 0; width: 330px; max-width: 92vw;
    background: rgba(20, 22, 28, .97); backdrop-filter: blur(10px);
    border-left: 1px solid var(--line); z-index: 60;
    transform: translateX(105%); transition: transform .25s ease;
    display: flex; flex-direction: column;
    box-shadow: -18px 0 50px -20px rgba(0, 0, 0, .6);
  }
  .playlist.open { transform: translateX(0); }
  .pl-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .pl-head b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-head span { color: var(--muted); font-size: 12px; }
  .pl-head button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-family: inherit;
  }
  .pl-head button:hover { color: var(--text); border-color: var(--accent); }
  .pl-list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  .pl-list::-webkit-scrollbar { width: 8px; }
  .pl-list::-webkit-scrollbar-thumb { background: #3a3f4d; border-radius: 4px; }
  .pl-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  .pl-list::-webkit-scrollbar-track { background: transparent; }
  .pl-item {
    display: flex; gap: 8px; align-items: center;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 12px; color: var(--muted); transition: background .15s, color .15s;
  }
  .pl-item:hover { background: rgba(251, 114, 153, .08); color: var(--text); }
  .pl-item.current { background: rgba(251, 114, 153, .16); color: var(--text); }
  .pl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-dan {
    font-size: 10px; color: #7ee2a8; border: 1px solid rgba(0, 205, 120, .4);
    padding: 1px 6px; border-radius: 999px; flex: none;
  }
  .pl-empty { padding: 20px; text-align: center; color: var(--muted); font-size: 12px; }
  .stage {
    position: relative; width: 100%; height: auto; flex: 1; min-height: 200px;
    background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 24px 70px -28px rgba(251, 114, 153, .28), 0 14px 50px -24px rgba(123, 92, 255, .30);
  }
  #player { width: 100%; height: 100%; }
  .placeholder {
    position: absolute; inset: 0; z-index: 5; cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 20px;
    background: radial-gradient(ellipse at center, #1c2029 0%, #101216 75%);
  }
  .placeholder.hide { display: none; }
  .placeholder .icon { font-size: 52px; }
  .placeholder .title { font-size: 18px; font-weight: 600; }
  .placeholder .sub { font-size: 13px; color: var(--muted); line-height: 1.8; }
  body.dragover #player { box-shadow: inset 0 0 0 3px rgba(139, 92, 246, .7); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #232733; border: 1px solid var(--line); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 13px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
    width: max-content; max-width: 80vw;
  }
  .toast.show { opacity: 1; }
  .pill {
    position: fixed; right: 18px; bottom: 28px;
    background: #232733; border: 1px solid var(--line); color: var(--text);
    padding: 8px 14px; border-radius: 10px; font-size: 12px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 99;
  }
  .pill.show { opacity: 1; pointer-events: auto; cursor: pointer; }
  /* ---- 加载信息条（行尾并入弹幕快捷开关） ---- */
  .infobar {
    display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center;
    margin-top: 12px; padding: 10px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  .infobar[hidden] { display: none; }
  .info-item { display: inline-flex; align-items: baseline; gap: 8px; }
  .info-k { color: var(--muted); font-size: 11px; letter-spacing: .5px; }
  .info-v { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .info-v.accent { color: var(--accent); }
  /* ---- 弹幕屏蔽（入口在信息条行尾，浮窗编辑词库） ---- */
  .btn-block {
    margin-left: auto;
    background: #232733; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 4px 12px; font-size: 12px; font-family: inherit; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .btn-block:hover { color: var(--accent); border-color: var(--accent); }
  .block-panel {
    position: fixed; right: 16px; bottom: 64px; z-index: 70;
    width: 320px; max-width: calc(100vw - 32px);
    display: flex; flex-direction: column; gap: 10px;
    background: rgba(20, 22, 28, .97); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    box-shadow: 0 24px 70px -28px rgba(0, 0, 0, .7);
  }
  .block-panel[hidden] { display: none; }
  .block-head { display: flex; align-items: center; gap: 10px; }
  .block-head b { font-size: 13px; }
  .block-count { font-size: 11px; color: var(--muted); }
  .block-head .spacer { flex: 1; }
  .block-head button {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; width: 24px; height: 24px; cursor: pointer; font-family: inherit;
  }
  .block-head button:hover { color: var(--text); border-color: var(--accent); }
  .block-panel textarea {
    width: 100%; resize: vertical;
    background: #232733; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.7;
    font-family: inherit; min-height: 120px;
  }
  .block-panel textarea:focus { outline: none; border-color: var(--accent); }
  .block-foot { font-size: 11px; color: var(--muted); line-height: 1.6; }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  /* ---- 音轨菜单（浮窗复用 block-panel 外壳） ---- */
  .track-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: #232733; color: var(--text); font-size: 12px;
    cursor: pointer; line-height: 1.5;
    transition: border-color .15s, color .15s;
  }
  .track-item:hover { border-color: var(--accent); }
  .track-item.current { border-color: var(--accent); color: var(--accent); }
  .track-item .t-meta { color: var(--muted); font-size: 11px; margin-left: auto; }
  .track-item.current .t-meta { color: var(--accent); }
  .track-item.disabled { opacity: .45; cursor: default; }
  .track-item.disabled:hover { border-color: var(--line); }
  /* ---- 页面滚动条 ---- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a2e37; border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <div class="field">
      <button type="button" id="btnOpenVideo" class="btn-folder" title="选择本地视频文件">🎬 打开视频</button>
      <button type="button" id="btnOpenFolder" class="btn-folder" title="选择剧集文件夹，生成播放列表">📂 打开文件夹</button>
      <button type="button" id="btnPlaylist" class="btn-folder" title="显示 / 隐藏剧集播放列表">📑 播放列表</button>
    </div>
    <div class="chips">
      <div class="chip" id="chipVideo">未加载视频</div>
      <div class="chip" id="chipDanmaku">未加载弹幕</div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div id="player"></div>
    <div class="placeholder" id="placeholder">
      <div class="icon">📺</div>
      <div class="title">拖入视频文件开始播放</div>
      <div class="sub">
        拖入视频即开始播放，同目录同名弹幕自动加载（无需任何授权）<br />
        拖入整个文件夹生成剧集播放列表，点击换集、播完自动下一集<br />
        弹幕支持 B 站 XML（.xml）与 mybili 导出 JSON（.json）
      </div>
    </div>
  </div>

  <div class="infobar" id="infobar" hidden>
    <div class="info-item"><span class="info-k">时长</span><span class="info-v" id="infoDuration">—</span></div>
    <div class="info-item"><span class="info-k">分辨率</span><span class="info-v" id="infoRes">—</span></div>
    <div class="info-item"><span class="info-k">视频大小</span><span class="info-v" id="infoSize">—</span></div>
    <div class="info-item"><span class="info-k">弹幕数量</span><span class="info-v accent" id="infoCount">—</span></div>
    <div class="info-item"><span class="info-k">弹幕解析</span><span class="info-v" id="infoParse">—</span></div>
    <div class="info-item"><span class="info-k">当前进度</span><span class="info-v" id="infoTime">—</span></div>
    <button type="button" class="btn-block" id="btnSubtitleEntry" title="选择字幕" hidden>📝 字幕</button>
    <button type="button" class="btn-block" id="btnAudioEntry" title="选择音轨" hidden>🎵 音轨</button>
    <button type="button" class="btn-block" id="btnBlockEntry" title="设置弹幕屏蔽词">🚫 弹幕屏蔽</button>
  </div>

  <div class="block-panel" id="blockPanel" hidden>
    <div class="block-head">
      <b>弹幕屏蔽</b>
      <span class="block-count" id="blockCount"></span>
      <span class="spacer"></span>
      <button type="button" id="blockClose" title="关闭">✕</button>
    </div>
    <label class="switch"><input type="checkbox" id="blockEnabled" /><span>启用屏蔽</span></label>
    <textarea id="blockWords" spellcheck="false" placeholder="一行一个屏蔽词&#10;弹幕内容包含该词即被隐藏"></textarea>
    <div class="block-foot">包含屏蔽词的弹幕将不再显示 · 改动即时生效并自动保存</div>
  </div>

  <div class="block-panel" id="audioPanel" hidden>
    <div class="block-head">
      <b>音轨</b>
      <span class="block-count" id="audioTrackCount"></span>
      <span class="spacer"></span>
      <button type="button" id="audioClose" title="关闭">✕</button>
    </div>
    <div id="audioTrackList"></div>
    <div class="block-foot">点击切换音轨 · 首次切换需后台把该音轨转成 AAC 外挂音频</div>
  </div>

  <div class="block-panel" id="subtitlePanel" hidden>
    <div class="block-head">
      <b>字幕</b>
      <span class="block-count" id="subtitleCount"></span>
      <span class="spacer"></span>
      <button type="button" id="subtitleClose" title="关闭">✕</button>
    </div>
    <div id="subtitleList"></div>
    <div class="block-foot">外挂字幕扫描同目录同名/变体文件 · 内嵌文本字幕需后台抽取为 SRT（PGS 图形字幕不支持）</div>
  </div>

  <aside class="playlist" id="playlist" aria-label="剧集播放列表">
    <div class="pl-head">
      <b id="plTitle">📂 播放列表</b>
      <span id="plCount"></span>
      <button type="button" id="plClose" title="关闭播放列表">✕</button>
    </div>
    <ul class="pl-list" id="plList"></ul>
  </aside>
</div>
<div class="toast" id="toast"></div>
<div class="pill" id="pill" title="点击取消转码"></div>

<script src="vendor/artplayer.js"></script>
<script src="vendor/artplayer-plugin-danmuku.js"></script>
<script src="vendor/artplayer-plugin-audio-track.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var placeholder = $('placeholder');
  var chipVideo = $('chipVideo');
  var chipDanmaku = $('chipDanmaku');
  var toastEl = $('toast');
  var pillEl = $('pill');

  var CONFIG_KEY = 'bplayer_danmaku_config';
  var isMobile = document.documentElement.clientWidth < 768;

  // 速度档位（value = 一条弹幕从右边进入到完全离开左边所需的秒数，越大越慢）。
  // 插件面板用精确匹配按 value 找标签，所以默认值和保存值都必须落在这几个 value
  // 上（读取保存配置时由 snapSpeed 对齐）。插件内部把 speed 夹在 [1,60]，
  // vendor 里已把原版上限 10 放开，极慢档才能取到 20 秒。
  var SPEED_STEPS = [
    { name: '极慢', value: 20 },
    { name: '较慢', value: 14 },
    { name: '适中', value: 9 },
    { name: '较快', value: 5 },
    { name: '极快', value: 3 }
  ];

  var art = null;               // Artplayer 实例
  var audioTrack = null;        // audio-track 插件接线（外挂音轨的 Audio 元素句柄）
  var danmakuList = [];         // 播放器格式弹幕数组
  var debugQueue = [];          // 插件内部队列引用（调试/验证用）
  var toastTimer = null;
  var seekFlushTimer = null;    // seek 清屏防抖

  // 跳转后立即清掉旧画面残留弹幕（插件原版会让旧弹幕滚完才消失）。
  // 防抖 80ms：拖动进度条连续 seek 时只在落点清一次，避免反复全量回收。
  function scheduleDanmakuFlush() {
    clearTimeout(seekFlushTimer);
    seekFlushTimer = setTimeout(function () {
      var p = danmakuPlugin();
      if (p) p.reset();
    }, 80);
  }

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 2600);
  }

  function fmtDuration(sec) {
    sec = Math.round(sec || 0);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }

  function fmtBytes(n) {
    if (!isFinite(n) || n <= 0) return '—';
    if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1024).toFixed(0) + ' KB';
  }

  /* 信息栏：时长 / 分辨率 / 进度 跟随 video 元素实时更新 */
  function updateVideoInfo() {
    var v = document.querySelector('#player video');
    if (!v) return;
    var hasDur = isFinite(v.duration) && v.duration > 0;
    var dur = hasDur ? fmtDuration(v.duration) : '—';
    $('infoDuration').textContent = dur;
    $('infoRes').textContent = v.videoWidth ? v.videoWidth + '×' + v.videoHeight : '—';
    chipVideo.innerHTML = '🎬 <b>' + escapeHtml(currentVideoName) + '</b>' + (hasDur ? ' · ' + dur : '');
    updateProgressInfo();
  }

  function updateProgressInfo() {
    var v = document.querySelector('#player video');
    if (!v) return;
    $('infoTime').textContent = fmtDuration(v.currentTime) + ' / ' + (isFinite(v.duration) && v.duration > 0 ? fmtDuration(v.duration) : '—');
  }

  /* ------------------------------------------------------------------ *
   * 弹幕解析：规则与 mybili 后端 DanmakuConverterService 完全一致
   *   time  : 秒（XML 中本就是秒；JSON 导出也是秒）
   *   mode  : B 站 1-3 滚动→0，5 顶部→1，4 底部→2，6-9 高级→降级滚动
   *   color : 十进制 → #RRGGBB
   *   高级弹幕内容为 JSON 数组，取索引 4 的纯文本
   * ------------------------------------------------------------------ */
  function convertColor(dec) {
    var n = Number(dec);
    if (!isFinite(n)) n = 16777215;
    return '#' + (n & 0xffffff).toString(16).padStart(6, '0').toUpperCase();
  }

  function convertMode(m) {
    m = Number(m);
    return m === 5 ? 1 : m === 4 ? 2 : 0;
  }

  function plainText(content) {
    var t = content.trim();
    if (t.charAt(0) === '[') {
      try {
        var arr = JSON.parse(t);
        if (Array.isArray(arr) && arr.length > 4 && arr[4] != null) return String(arr[4]);
      } catch (e) { /* 非高级弹幕，按原文本处理 */ }
    }
    return content;
  }

  function makeItem(time, mode, color, text) {
    return { text: text, time: time, mode: mode, color: color, border: false, style: {} };
  }

  function parseBiliXml(xmlText) {
    var out = [];
    var doc = null;
    try {
      doc = new DOMParser().parseFromString(xmlText, 'text/xml');
      if (doc.getElementsByTagName('parsererror').length) doc = null;
    } catch (e) { doc = null; }

    if (doc) {
      var nodes = doc.getElementsByTagName('d');
      for (var i = 0; i < nodes.length; i++) {
        var p = (nodes[i].getAttribute('p') || '').split(',');
        var text = plainText(nodes[i].textContent || '');
        if (!text) continue;
        out.push(makeItem(parseFloat(p[0]) || 0, convertMode(p[1]), convertColor(p[3]), text));
      }
    } else {
      // 容错：XML 含非法字符导致解析失败时，退回正则提取
      var decode = function (s) {
        return s
          .replace(/&#(\d+);/g, function (_, n) { return String.fromCharCode(+n); })
          .replace(/&lt;/g, '<').replace(/&gt;/g, '>')
          .replace(/&quot;/g, '"').replace(/&apos;/g, "'")
          .replace(/&amp;/g, '&');
      };
      var re = /<d p="([^"]*)">([\s\S]*?)<\/d>/g;
      var m;
      while ((m = re.exec(xmlText))) {
        var pp = m[1].split(',');
        var t2 = plainText(decode(m[2]));
        if (!t2) continue;
        out.push(makeItem(parseFloat(pp[0]) || 0, convertMode(pp[1]), convertColor(pp[3]), t2));
      }
    }
    out.sort(function (a, b) { return a.time - b.time; });
    return out;
  }

  function parseJsonDanmaku(text) {
    var data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error('JSON 弹幕应为数组（mybili 导出格式）');
    var out = [];
    for (var i = 0; i < data.length; i++) {
      var d = data[i] || {};
      var txt = String(d.text == null ? '' : d.text);
      if (!txt) continue;
      var mode = Number(d.mode);
      out.push(makeItem(
        Number(d.time) || 0,
        (mode === 0 || mode === 1 || mode === 2) ? mode : convertMode(d.mode),
        typeof d.color === 'number' ? convertColor(d.color) : (d.color || '#FFFFFF'),
        txt
      ));
    }
    out.sort(function (a, b) { return a.time - b.time; });
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 播放器（配置与 mybili Player.vue 对齐，设置持久化到 localStorage）
   * ------------------------------------------------------------------ */
  function defaultDanmakuOption() {
    return {
      speed: isMobile ? 5 : 9,
      antiOverlap: true,
      synchronousPlayback: false,
      fontSize: isMobile ? 14 : 25,
      theme: 'light',
      margin: isMobile ? [10, '75%'] : [10, 10],
      modes: [0, 1, 2]
    };
  }

  function loadSavedConfig() {
    try {
      var c = JSON.parse(localStorage.getItem(CONFIG_KEY)) || {};
      if (typeof c.speed === 'number') c.speed = snapSpeed(c.speed);
      return c;
    } catch (e) { return {}; }
  }

  function saveConfig(opt) {
    try {
      localStorage.setItem(CONFIG_KEY, JSON.stringify({
        speed: opt.speed,
        antiOverlap: opt.antiOverlap,
        synchronousPlayback: opt.synchronousPlayback,
        fontSize: opt.fontSize,
        theme: opt.theme,
        margin: opt.margin,
        modes: opt.modes,
        opacity: opt.opacity
      }));
    } catch (e) { /* 隐私模式等场景下忽略 */ }
  }

  function danmakuPlugin() {
    return art && art.plugins && art.plugins.artplayerPluginDanmuku;
  }

  function createPlayer(url) {
    var option = defaultDanmakuOption();
    var saved = loadSavedConfig();
    for (var k in saved) option[k] = saved[k];
    option.danmuku = danmakuList;
    option.SPEED = { min: 0, max: SPEED_STEPS.length - 1, steps: SPEED_STEPS };

    art = new Artplayer({
      container: $('player'),
      url: url,
      volume: isMobile ? 1 : 0.5,
      fullscreen: true,
      fullscreenWeb: !isMobile,
      autoOrientation: true,
      setting: true,
      playbackRate: true,
      flip: true,
      pip: true,
      miniProgressBar: true,
      theme: '#fb7299',
      lang: 'zh-cn',
      plugins: [artplayerPluginDanmuku(option)]
    });

    // 外挂音轨：audio-track 插件，独立 Audio 元素跟随视频时钟（工厂函数直接接线，不走插件管理器）
    audioTrack = artplayerPluginAudioTrack({ url: '' })(art);

    art.on('artplayerPluginDanmuku:config', function (opt) { saveConfig(opt); });
    art.on('artplayerPluginDanmuku:loaded', function (q) { debugQueue = q; });
    art.on('video:ended', function () { if (window.__BplayerNext) window.__BplayerNext(); });

    var v = document.querySelector('#player video');
    if (v) {
      v.addEventListener('loadedmetadata', updateVideoInfo);
      v.addEventListener('durationchange', updateVideoInfo);
      v.addEventListener('timeupdate', updateProgressInfo);
      if (v.readyState >= 1) updateVideoInfo(); // 元数据可能已就绪，防止错过事件
      v.addEventListener('error', function () {
        toast('视频无法播放：浏览器可能不支持该文件的编码（如 MKV / HEVC）', 5000);
      });
      v.addEventListener('seeking', scheduleDanmakuFlush);
    }
  }

  var currentVideoName = '';
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setVideoFromUrl(url, name, size) {
    if (currentVideoName !== name) danmakuLoadToken++; // 作废仍在解析的旧弹幕任务
    currentVideoName = name;
    if (!art) {
      createPlayer(url);
    } else {
      art.url = url; // Artplayer 切换视频源
    }
    placeholder.classList.add('hide');
    chipVideo.innerHTML = '🎬 <b>' + escapeHtml(name) + '</b>';
    document.title = name + ' · Danmuku Video Player';
    // 信息栏：立即显示文件大小，时长/分辨率等元数据就绪后补齐
    $('infobar').hidden = false;
    $('infoSize').textContent = size ? fmtBytes(size) : '—';
    $('infoDuration').textContent = '—';
    $('infoRes').textContent = '—';
    $('infoTime').textContent = '—';
    updateVideoInfo();
    // 选择文件属于用户手势，可以自动起播
    try { Promise.resolve(art.play()).catch(function () {}); } catch (e) {}
  }

  function applyDanmaku() {
    var p = danmakuPlugin();
    if (p) {
      // 插件装载队列只读 option.danmuku（插件原始拼写，没有 danmaku 别名）。
      // 传错拼键 config({danmaku:...}) 不会生效，弹幕会一条都不显示。
      p.config({ danmuku: filterDanmaku(danmakuList) });
      p.load();
    }
  }

  function applyDanmakuText(name, text, t0) {
    var list;
    if (/\.json$/i.test(name)) list = parseJsonDanmaku(text);
    else list = parseBiliXml(text);
    danmakuList = list;
    applyDanmaku();
    var ms = Math.round(performance.now() - t0);
    chipDanmaku.innerHTML = '💬 <b>' + list.length.toLocaleString() + '</b> 条弹幕 · ' + ms + 'ms';
    $('infobar').hidden = false;
    $('infoCount').textContent = list.length.toLocaleString() + ' 条';
    $('infoParse').textContent = ms + ' ms';
    toast('已装载 ' + list.length.toLocaleString() + ' 条弹幕');
  }

  /* 弹幕解析任务代际：切换视频/清空后，过期解析结果直接丢弃。
     同名弹幕配对在桌面端由 Rust 侧 pair_danmaku 直接读盘完成，无授权流程。 */
  var danmakuLoadToken = 0;

  function baseName(n) { return String(n).replace(/\.[^.]+$/, ''); }

  function clearDanmaku() {
    danmakuLoadToken++;
    danmakuList = [];
    applyDanmaku();
    chipDanmaku.textContent = '💬 未加载弹幕';
    $('infoCount').textContent = '—';
    $('infoParse').textContent = '—';
  }

  /* ---------------------------- 事件绑定 ---------------------------- */
  placeholder.addEventListener('click', function () {
    window.__TAURI__.core.invoke('pick_video').then(function (p) {
      if (p) window.__BplayerDesktop.loadVideo(p, null);
    });
  });

  /* 速度档位取整：读取保存配置时对齐到 SPEED_STEPS 中的有效档位。
   * 只往「不更快」的方向吸附（取不小于原值的最慢档），升级后绝不会比原来快；
   * 旧的隐藏档（9/8/7/6/4/2.5/2/1.5）也因此落到更慢的一侧。
   * SPEED_STEPS 按慢 → 快排列，降序扫描时最后一个 >= v 的档就是最近档。 */
  function speedIndex(v) {
    var best = 0;
    for (var i = 0; i < SPEED_STEPS.length; i++) {
      if (SPEED_STEPS[i].value >= v) best = i;
    }
    return best;
  }

  function snapSpeed(v) { return SPEED_STEPS[speedIndex(v)].value; }

  /* ------------------------------------------------------------------ *
   * 弹幕屏蔽：包含关键词的弹幕直接不进入插件队列（filterDanmaku）。
   * 词库一行一个，开关与词库改动即时生效并持久化到本机。
   * danmakuList 始终保存未过滤的全量弹幕，换词库后无需重新解析文件。
   * ------------------------------------------------------------------ */
  var BLOCK_KEY = 'bplayer_block_config';
  var blockState = { enabled: false, words: '' };
  var blockWordsCache = null;   // 去重后的小写词数组，词库变动后置空重建
  var blockInputTimer = null;

  function loadBlockConfig() {
    try {
      var c = JSON.parse(localStorage.getItem(BLOCK_KEY));
      if (c) {
        blockState.enabled = !!c.enabled;
        blockState.words = String(c.words || '');
      }
    } catch (e) { /* 损坏的配置按默认关闭处理 */ }
  }

  function saveBlockConfig() {
    try { localStorage.setItem(BLOCK_KEY, JSON.stringify(blockState)); } catch (e) { /* 忽略持久化失败 */ }
  }

  function blockWords() {
    if (blockWordsCache) return blockWordsCache;
    var seen = {}, out = [];
    blockState.words.split('\n').forEach(function (w) {
      w = w.trim().toLowerCase();
      if (w && !seen[w]) { seen[w] = 1; out.push(w); }
    });
    blockWordsCache = out;
    return out;
  }

  function filterDanmaku(list) {
    if (!blockState.enabled) return list;
    var words = blockWords();
    if (!words.length) return list;
    return list.filter(function (item) {
      var t = String(item.text).toLowerCase();
      for (var i = 0; i < words.length; i++) {
        if (t.indexOf(words[i]) > -1) return false;
      }
      return true;
    });
  }

  function updateBlockMeta() {
    var n = blockWords().length;
    $('blockCount').textContent = blockState.enabled ? n + ' 个屏蔽词' : '已关闭';
  }

  function applyBlockSettings() {
    blockWordsCache = null;
    saveBlockConfig();
    applyDanmaku();   // 按新词库重新过滤并装载（未建播放器时是安全的空操作）
    updateBlockMeta();
  }

  function bindBlockPanel() {
    var panel = $('blockPanel');
    $('btnBlockEntry').addEventListener('click', function () {
      var opening = panel.hidden;
      panel.hidden = !opening;
      if (opening) {
        $('blockEnabled').checked = blockState.enabled;
        $('blockWords').value = blockState.words;
        updateBlockMeta();
      }
    });
    $('blockClose').addEventListener('click', function () { panel.hidden = true; });
    $('blockEnabled').addEventListener('change', function () {
      blockState.enabled = this.checked;
      applyBlockSettings();
    });
    $('blockWords').addEventListener('input', function () {
      clearTimeout(blockInputTimer);
      var v = this.value;
      blockInputTimer = setTimeout(function () {
        blockState.words = v;
        applyBlockSettings();
      }, 400);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') panel.hidden = true;
    });
  }
  /* ------------------------------------------------------------------ *
   * 桌面版主流程（Tauri）
   * 拖拽拿到真实路径，主进程直接读盘，
   * 同名弹幕零授权自动加载；拖入文件夹生成剧集播放列表。
   * ------------------------------------------------------------------ */
  function initDesktop() {
    var T = window.__TAURI__;
    var invoke = T.core.invoke;
    var playlist = [], playlistDir = '', currentEpIndex = -1;

    function pathName(p) { return String(p).replace(/\\/g, '/').split('/').pop(); }
    function pathDir(p) { return String(p).replace(/[\\/][^\\/]+$/, ''); }
    function normPath(p) { return String(p).replace(/\\/g, '/'); }
    function mediaUrl(p) { return T.core.convertFileSrc(p); }

    function renderPlaylist() {
      var ul = $('plList');
      ul.innerHTML = '';
      if (!playlist.length) {
        ul.innerHTML = '<li class="pl-empty">拖入整个文件夹，或点「打开文件夹」<br/>生成剧集播放列表</li>';
      }
      playlist.forEach(function (ep, i) {
        var li = document.createElement('li');
        li.className = 'pl-item' + (i === currentEpIndex ? ' current' : '');
        li.title = ep.name + (ep.danmaku ? ' · ' + ep.danmaku : ' · 无同名弹幕');
        var nm = document.createElement('span');
        nm.className = 'pl-name';
        nm.textContent = ep.name;
        li.appendChild(nm);
        if (ep.danmaku) {
          var bd = document.createElement('span');
          bd.className = 'pl-dan';
          bd.textContent = '弹幕';
          li.appendChild(bd);
        }
        li.addEventListener('click', function () { desktopLoadVideo(ep.path, null, i); });
        ul.appendChild(li);
      });
      $('plCount').textContent = playlist.length ? playlist.length + ' 集' : '';
    }

    async function loadPlaylist(dir, open) {
      var scan = await invoke('scan_folder', { dir: dir });
      playlist = scan.episodes;
      playlistDir = normPath(dir);
      $('plTitle').textContent = '📂 ' + scan.label;
      renderPlaylist();
      if (open) $('playlist').classList.add('open');
      return scan;
    }

    function desktopLoadDanmaku(name, text) {
      chipDanmaku.textContent = '💬 解析中…';
      var token = ++danmakuLoadToken;
      var t0 = performance.now();
      setTimeout(function () {
        if (token !== danmakuLoadToken) return;
        applyDanmakuText(name, text, t0);
      }, 30);
    }

    // ---- 音轨编码探测 + 外挂音轨（audio-track 插件） ----
    // 依据实测：DTS/TrueHD/AC-4/DRA/LPCM 内核解不了（无声）；AC-3/E-AC-3 随 WebView2 与系统解码器而定。
    // 死编码 → 后台把指定音轨转成独立 (音轨N).mka（视频不动，仍从原文件播），audio-track 插件同步外挂；
    // 已有 (AAC).mkv 整片缓存 → 直接换源自包含播放；只有 AC-3 等不可靠编码 → 仅提示不转换。
    var probeToken = 0;
    var transcodeVideo = '';    // 正在转换的源视频（归一化路径）
    var transcodeOrdinal = -1;  // 正在转换的音轨序号（1-based）
    var currentVideoPath = '';  // 当前播放的源视频（归一化路径）
    var externalOrdinal = -1;   // 当前挂载的外挂音轨序号；-1 = 无
    var probeTracks = null;     // 最近一次探测的音轨列表（仅 audio）
    var probeDurationUs = null;
    var fullCacheActive = false; // 已换到自包含 (AAC).mkv 播放
    var subItems = [];          // 字幕菜单条目（外挂文件 + 内嵌轨 + PGS 占位）
    var mountedSubId = '';      // 当前挂载的字幕条目 id；'' = 关闭
    var pendingSub = null;      // 正在后台抽取的内嵌字幕条目
    var pillLabel = '音轨';     // 当前后台任务的类型标签

    function codecName(c) {
      if (c.indexOf('A_DTS') === 0) return 'DTS（含 DTS-HD）';
      if (c === 'A_TRUEHD') return 'TrueHD';
      if (c === 'A_AC4') return 'AC-4';
      if (c === 'A_DRA') return 'DRA';
      if (c === 'A_AC3') return 'AC-3';
      if (c === 'A_EAC3') return 'E-AC-3';
      if (c.indexOf('A_PCM') === 0) return 'LPCM';
      if (c === 'S_TEXT/UTF8' || c === 'S_TEXT/ASCII') return 'SRT';
      if (c === 'S_TEXT/ASS' || c === 'S_TEXT/SSA') return 'ASS';
      if (c === 'S_TEXT/WEBVTT') return 'WebVTT';
      if (c.indexOf('S_HDMV/PGS') === 0) return 'PGS';
      if (c.indexOf('S_VOBSUB') === 0) return 'VobSub';
      return c;
    }

    function classifyAudio(tracks) {
      var audios = (tracks || []).filter(function (t) { return t.kind === 'audio'; });
      var res = { count: audios.length, dead: 0, deadNames: [], shakyNames: [], audioIndex: -1 };
      audios.forEach(function (t, i) {
        var c = String(t.codec || '').toUpperCase();
        if (c.indexOf('A_DTS') === 0 || c === 'A_TRUEHD' || c === 'A_AC4' || c === 'A_DRA') { res.dead++; res.deadNames.push(codecName(c)); }
        else if (c === 'A_AC3' || c === 'A_EAC3' || c.indexOf('A_PCM') === 0) res.shakyNames.push(codecName(c));
        if (res.audioIndex < 0 && t.default) res.audioIndex = i; // 默认目标：default 音轨，否则第一条
      });
      if (res.audioIndex < 0) res.audioIndex = 0;
      var uniq = function (a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); };
      res.deadNames = uniq(res.deadNames);
      res.shakyNames = uniq(res.shakyNames);
      return res;
    }

    function handleAudioCodecs(path, name) {
      if (!/\.(mkv|mka|webm)$/i.test(name)) return;
      var token = ++probeToken;
      invoke('probe_mkv_tracks', { path: path }).then(function (probe) {
        if (token !== probeToken) return;
        probeTracks = (probe.tracks || []).filter(function (t) { return t.kind === 'audio'; });
        probeDurationUs = probe.duration_us || null;
        refreshAudioMenu();
        buildSubtitleMenu(path, probe.tracks, token);
        var c = classifyAudio(probe.tracks);
        if (!c.count || (!c.dead && !c.shakyNames.length)) return; // 内部音轨可播，不打扰
        var fullCache = fullAacPath(path);
        invoke('fs_stat', { path: fullCache }).then(function (st) {
          if (token !== probeToken) return;
          if (st.kind === 'file') {
            switchToAudioCache(path, fullCache, st.size, true); // 整片缓存命中：静默换源
            return;
          }
          if (!c.dead) {
            toast('音轨编码（' + c.shakyNames.join(' / ') + '）解码不可靠（随 WebView2 版本而定），可能无声', 8000);
            return;
          }
          ensureAudioTrack(path, probeDurationUs, c.audioIndex, c.deadNames.join(' / '));
        }).catch(function () { });
      }).catch(function () { });
    }

    // 确保某条音轨的外挂 mka 存在：命中直接挂载，未命中后台转换完成后挂载
    function ensureAudioTrack(path, durationUs, audioIdx, label) {
      var ordinal = audioIdx + 1;
      invoke('transcode_target', { videoPath: path, audioIndex: audioIdx }).then(function (mkaPath) {
        if (normPath(currentVideoPath) !== normPath(path)) return;
        invoke('fs_stat', { path: mkaPath }).then(function (st) {
          if (normPath(currentVideoPath) !== normPath(path)) return;
          if (st.kind === 'file') { engageExternalAudio(path, mkaPath, ordinal, true); return; }
          if (transcodeVideo === normPath(path) && transcodeOrdinal === ordinal) return; // 这条已在转
          transcodeVideo = normPath(path);
          transcodeOrdinal = ordinal;
          updatePill(-1, 0);
          invoke('transcode_audio_start', { videoPath: path, audioIndex: audioIdx, durationUs: durationUs || null }).then(function () {
            if (transcodeVideo === normPath(path)) {
              toast('音轨' + ordinal + '（' + label + '）本内核无法解码，正在后台转换为 AAC 外挂音轨', 6000);
            }
          }).catch(function (e) {
            hidePill();
            transcodeVideo = '';
            transcodeOrdinal = -1;
            toast('音轨转换未能启动：' + e, 8000);
          });
        }).catch(function () { });
      }).catch(function () { });
    }

    // 挂载外挂音频（audio-track 插件用独立 Audio 元素跟视频同步；原音轨无声，不会打架）
    function engageExternalAudio(path, mkaPath, ordinal, silent) {
      if (!audioTrack || normPath(currentVideoPath) !== normPath(path)) return;
      externalOrdinal = ordinal;
      audioTrack.update({ url: mediaUrl(mkaPath) });
      refreshAudioMenu();
      if (!silent) toast('音轨' + ordinal + ' 外挂音频已挂载');
    }

    function resetExternalAudio() {
      if (audioTrack) {
        try {
          audioTrack.audio.pause();
          audioTrack.audio.removeAttribute('src');
          audioTrack.audio.load();
        } catch (e) { }
      }
      externalOrdinal = -1;
      refreshAudioMenu();
    }

    // 换到 (AAC).mkv 整片缓存版：保留播放进度；弹幕/标题仍按原文件
    function switchToAudioCache(path, cachePath, size, silent) {
      if (!art || normPath(currentVideoPath) !== normPath(path)) return;
      resetExternalAudio();
      fullCacheActive = true;
      refreshAudioMenu();
      var t = art.currentTime || 0;
      art.url = mediaUrl(cachePath);
      art.once('video:canplay', function () {
        try { if (t > 0.3) art.currentTime = t; } catch (e) { }
        try { art.play(); } catch (e) { }
      });
      if (size) $('infoSize').textContent = fmtBytes(size);
      if (!silent) toast('已切换到 AAC 整片缓存版（播放进度保留）');
    }

    // ---- 音轨菜单（存在死编码音轨的多轨文件才出现；全可播的文件内核直接播，不做外挂） ----
    function hasDeadAudio() {
      return (probeTracks || []).some(function (t) {
        var c = String(t.codec || '').toUpperCase();
        return c.indexOf('A_DTS') === 0 || c === 'A_TRUEHD' || c === 'A_AC4' || c === 'A_DRA';
      });
    }
    function refreshAudioMenu() {
      var btn = $('btnAudioEntry');
      var panel = $('audioPanel');
      if (fullCacheActive || !hasDeadAudio() || !probeTracks || probeTracks.length < 2) {
        btn.hidden = true;
        panel.hidden = true;
        return;
      }
      btn.hidden = false;
      $('audioTrackCount').textContent = probeTracks.length + ' 条';
      var list = $('audioTrackList');
      list.innerHTML = '';
      probeTracks.forEach(function (t, i) {
        var ordinal = i + 1;
        var item = document.createElement('div');
        item.className = 'track-item' + (externalOrdinal === ordinal ? ' current' : '');
        var main = document.createElement('span');
        main.textContent = '音轨' + ordinal + (t.default ? '（默认）' : '');
        item.appendChild(main);
        var meta = document.createElement('span');
        meta.className = 't-meta';
        meta.textContent = [codecName(String(t.codec || '').toUpperCase()), t.lang].filter(Boolean).join(' · ');
        item.appendChild(meta);
        item.addEventListener('click', function () { switchAudioTrack(i); });
        list.appendChild(item);
      });
    }

    function switchAudioTrack(i) {
      if (fullCacheActive || !hasDeadAudio() || !probeTracks || !probeTracks[i] || !currentVideoPath) return;
      $('audioPanel').hidden = true;
      if (externalOrdinal === i + 1) return;
      var t = probeTracks[i];
      var label = codecName(String(t.codec || '').toUpperCase()) || '未知编码';
      ensureAudioTrack(currentVideoPath, probeDurationUs, i, label);
    }

    // ---- 字幕：外挂扫描 + 内嵌抽取（artplayer 原生 srt/ass→VTT 管线，asset 协议带 CORS） ----
    function subSrtPath(p, ordinal) {
      return String(p).replace(/\.mkv$/i, ' (字幕' + ordinal + ').srt');
    }

    // 编码探测：严格 UTF-8 解不过就当 GBK（常见中文 srt 是 GBK）
    function detectEncoding(path) {
      return invoke('read_bytes', { path: path }).then(function (b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        try { new TextDecoder('utf-8', { fatal: true }).decode(bytes); return 'utf-8'; }
        catch (e) { return 'gbk'; }
      }).catch(function () { return null; });
    }

    function buildSubtitleMenu(path, tracks, token) {
      invoke('scan_subtitles', { videoPath: path }).then(function (exts) {
        if (token !== probeToken) return;
        subItems = [];
        (exts || []).forEach(function (f) {
          var ext = f.name.split('.').pop().toLowerCase();
          subItems.push({
            id: 'ext:' + f.path,
            kind: 'ext',
            name: f.name,
            path: f.path,
            type: ext === 'ass' || ext === 'ssa' ? 'ass' : (ext === 'vtt' ? 'vtt' : 'srt'),
          });
        });
        var subOrdinal = 0;
        (tracks || []).forEach(function (t) {
          if (t.kind !== 'subtitle') return;
          subOrdinal++;
          var c = String(t.codec || '').toUpperCase();
          var label = t.name || t.lang || ('字幕' + subOrdinal);
          if (c.indexOf('S_TEXT') === 0) {
            subItems.push({ id: 'emb:' + subOrdinal, kind: 'embedded', ordinal: subOrdinal, name: '内嵌 ' + label, codecLabel: codecName(c), type: 'srt', default: !!t.default });
          } else {
            // PGS / VobSub 等图形字幕：内核无法渲染，菜单里明确标出
            subItems.push({ id: 'pgs:' + subOrdinal, kind: 'bitmap', name: '内嵌 ' + label + '（' + codecName(c) + ' 图形字幕，不支持）', disabled: true });
          }
        });
        refreshSubtitleMenu();
        if (!mountedSubId) autoMountSubtitle();
      }).catch(function () { });
    }

    function refreshSubtitleMenu() {
      var btn = $('btnSubtitleEntry');
      var panel = $('subtitlePanel');
      if (!subItems.length) {
        btn.hidden = true;
        panel.hidden = true;
        return;
      }
      btn.hidden = false;
      $('subtitleCount').textContent = subItems.length + ' 项';
      var list = $('subtitleList');
      list.innerHTML = '';
      var off = document.createElement('div');
      off.className = 'track-item' + (mountedSubId === '' ? ' current' : '');
      off.textContent = '关闭字幕';
      off.addEventListener('click', unmountSubtitle);
      list.appendChild(off);
      subItems.forEach(function (s) {
        var item = document.createElement('div');
        if (s.disabled) {
          item.className = 'track-item disabled';
          item.textContent = s.name;
          list.appendChild(item);
          return;
        }
        item.className = 'track-item' + (mountedSubId === s.id ? ' current' : '');
        var main = document.createElement('span');
        main.textContent = s.name;
        item.appendChild(main);
        var meta = document.createElement('span');
        meta.className = 't-meta';
        var bits = [];
        if (s.kind === 'ext') bits.push('外挂');
        if (s.kind === 'embedded') bits.push('内嵌');
        if (s.codecLabel) bits.push(s.codecLabel);
        else if (s.type) bits.push(s.type.toUpperCase());
        meta.textContent = bits.join(' · ');
        item.appendChild(meta);
        item.addEventListener('click', function () { mountSubtitle(s, false); });
        list.appendChild(item);
      });
    }

    function mountSubtitle(s, silent) {
      if (s.disabled || !currentVideoPath) return;
      $('subtitlePanel').hidden = true;
      if (s.kind === 'ext') {
        mountSubtitleUrl(mediaUrl(s.path), s, silent);
        return;
      }
      // 内嵌：确保抽取出的 srt 存在，未抽取则后台转一次（完成事件里挂载）
      var cachePath = subSrtPath(currentVideoPath, s.ordinal);
      invoke('fs_stat', { path: cachePath }).then(function (st) {
        if (st.kind === 'file') { mountSubtitleUrl(mediaUrl(cachePath), s, silent); return; }
        pendingSub = s;
        pillLabel = '字幕';
        transcodeVideo = currentVideoPath;
        transcodeOrdinal = -1;
        updatePill(-1, 0);
        invoke('extract_subtitle_start', { videoPath: currentVideoPath, subIndex: s.ordinal - 1, durationUs: probeDurationUs || null }).then(function () {
          if (transcodeVideo === currentVideoPath && pendingSub === s) toast('正在后台抽取内嵌字幕，完成后自动挂载', 6000);
        }).catch(function (e) {
          hidePill();
          transcodeVideo = '';
          pendingSub = null;
          toast('字幕抽取未能启动：' + e, 8000);
        });
      }).catch(function () { });
    }

    function mountSubtitleUrl(url, s, silent) {
      if (!art) return;
      var opt = { name: s.name, type: s.type };
      var encPromise = s.encoding
        ? Promise.resolve(s.encoding)
        : (s.kind === 'ext' ? detectEncoding(s.path) : Promise.resolve('utf-8'));
      encPromise.then(function (enc) {
        if (enc) { s.encoding = enc; opt.encoding = enc; }
        return art.subtitle.switch(url, opt);
      }).then(function () {
        mountedSubId = s.id;
        art.subtitle.style({ display: 'block' });
        refreshSubtitleMenu();
        if (!silent) toast('已挂载字幕：' + s.name);
      }).catch(function (e) {
        toast('字幕加载失败：' + e, 6000);
      });
    }

    function unmountSubtitle() {
      mountedSubId = '';
      $('subtitlePanel').hidden = true;
      if (art) art.subtitle.style({ display: 'none' });
      refreshSubtitleMenu();
    }

    // 自动挂载：同名/变体外挂 > 默认内嵌文本轨 > 第一条内嵌文本轨 > 第一条外挂
    function autoMountSubtitle() {
      var vb = baseName(currentVideoName).toLowerCase();
      var exact = subItems.filter(function (s) {
        if (s.kind !== 'ext') return false;
        var b = baseName(s.name).toLowerCase();
        return b === vb || b.indexOf(vb + '.') === 0;
      });
      var embDefault = subItems.filter(function (s) { return s.kind === 'embedded' && s.default; });
      var embFirst = subItems.filter(function (s) { return s.kind === 'embedded'; });
      var extFirst = subItems.filter(function (s) { return s.kind === 'ext'; });
      var cand = exact[0] || embDefault[0] || embFirst[0] || extFirst[0];
      if (cand) mountSubtitle(cand, !!exact[0]);
    }

    function pillText(percent, written) {
      var s = '⏳ 后台处理' + pillLabel;
      if (percent >= 0) s += ' ' + Math.round(percent) + '%';
      if (written) s += ' · ' + fmtBytes(written);
      return s;
    }
    function updatePill(percent, written) {
      pillEl.textContent = pillText(percent, written);
      pillEl.classList.add('show');
    }
    function hidePill() { pillEl.classList.remove('show'); }
    pillEl.addEventListener('click', function () {
      invoke('transcode_audio_cancel').then(function (ok) {
        if (ok) { hidePill(); transcodeVideo = ''; transcodeOrdinal = -1; pendingSub = null; toast('已取消后台处理'); }
      });
    });

    async function desktopLoadVideo(path, manualDanPath, epIndex) {
      var name = pathName(path);
      var st = await invoke('fs_stat', { path: path });
      if (st.kind !== 'file') { toast('文件不存在：' + name); return; }
      currentVideoPath = normPath(path);
      probeTracks = null;
      probeDurationUs = null;
      fullCacheActive = false;
      subItems = [];
      mountedSubId = '';
      pendingSub = null;
      pillLabel = '音轨';
      if (art) art.subtitle.style({ display: 'none' }); // 上一部的字幕先藏起来，扫描到新的会自动挂载
      if (transcodeVideo && transcodeVideo !== currentVideoPath) hidePill(); // 旧任务继续后台跑，胶囊先收起
      resetExternalAudio();
      setVideoFromUrl(mediaUrl(path), name, st.size);
      handleAudioCodecs(path, name);
      // 外挂字幕扫描对全部视频类型生效（内嵌轨只有 MKV 能探测，由 handleAudioCodecs 补齐）
      if (!/\.(mkv|mka|webm)$/i.test(name)) buildSubtitleMenu(path, null, ++probeToken);
      var dir = pathDir(path);
      if (epIndex == null) {
        if (!playlist.length || playlistDir !== normPath(dir)) await loadPlaylist(dir, false);
        epIndex = -1;
        for (var i = 0; i < playlist.length; i++) if (normPath(playlist[i].path) === normPath(path)) { epIndex = i; break; }
      }
      currentEpIndex = epIndex;
      renderPlaylist();
      // 弹幕：手动拖入优先，否则零授权同名配对（直接打开 (AAC) 缓存时按原文件名配对）
      if (manualDanPath) {
        desktopLoadDanmaku(pathName(manualDanPath), await invoke('read_text', { path: manualDanPath }));
      } else {
        var pairPath = / \(AAC\)\.mkv$/i.test(name) ? path.replace(/ \(AAC\)\.mkv$/i, '.mkv') : path;
        var pair = await invoke('pair_danmaku', { videoPath: pairPath });
        if (pair) {
          desktopLoadDanmaku(pair.name, pair.text);
          toast('已自动加载同名弹幕：' + pair.name);
        } else {
          clearDanmaku();
          toast('「' + baseName(name) + '」同目录没有同名弹幕（.xml / .json）', 4200);
        }
      }
    }
    window.__BplayerDesktop = { loadVideo: desktopLoadVideo };

    $('btnOpenVideo').addEventListener('click', async function () {
      var p = await invoke('pick_video');
      if (p) desktopLoadVideo(p, null);
    });
    $('btnOpenFolder').addEventListener('click', async function () {
      var d = await invoke('pick_folder');
      if (d) { await loadPlaylist(d, true); toast('已加载播放列表 · ' + playlist.length + ' 集'); }
    });
    $('btnPlaylist').addEventListener('click', function () { $('playlist').classList.toggle('open'); });
    $('plClose').addEventListener('click', function () { $('playlist').classList.remove('open'); });
    $('btnAudioEntry').addEventListener('click', function () { $('audioPanel').hidden = !$('audioPanel').hidden; });
    $('audioClose').addEventListener('click', function () { $('audioPanel').hidden = true; });
    $('btnSubtitleEntry').addEventListener('click', function () { $('subtitlePanel').hidden = !$('subtitlePanel').hidden; });
    $('subtitleClose').addEventListener('click', function () { $('subtitlePanel').hidden = true; });

    // 播完自动下一集
    window.__BplayerNext = function () {
      if (currentEpIndex >= 0 && currentEpIndex + 1 < playlist.length) {
        toast('自动播放下一集：' + playlist[currentEpIndex + 1].name);
        desktopLoadVideo(playlist[currentEpIndex + 1].path, null, currentEpIndex + 1);
      }
    };

    // 拖拽：Tauri 给真实路径（文件夹=播放列表；视频=零授权配对）
    T.webview.getCurrentWebview().onDragDropEvent(async function (ev) {
      // 全局 bundle 的回调给的是信封 {event, payload}，兼容解包后的形状
      var p = ev && ev.payload ? ev.payload : ev;
      if (!p) return;
      if (p.type === 'enter' || p.type === 'over') document.body.classList.add('dragover');
      if (p.type === 'leave' || p.type === 'drop') document.body.classList.remove('dragover');
      if (p.type !== 'drop' || !p.paths || !p.paths.length) return;
      var paths = p.paths;
      var st = await invoke('fs_stat', { path: paths[0] });
      if (st.kind === 'dir') {
        var scan = await loadPlaylist(paths[0], true);
        toast('已加载播放列表「' + scan.label + '」· ' + playlist.length + ' 集');
        return;
      }
      var video = null, dan = null;
      for (var i = 0; i < paths.length; i++) {
        var n = pathName(paths[i]);
        if (!video && /\.(mp4|m4v|webm|mov|mkv|avi|ts|flv|wmv|mpg|mpeg)$/i.test(n)) video = paths[i];
        if (!dan && /\.(xml|json)$/i.test(n)) dan = paths[i];
      }
      if (video) desktopLoadVideo(video, dan);
      else if (dan) desktopLoadDanmaku(pathName(dan), await invoke('read_text', { path: dan }));
      else toast('未识别的文件：请拖入视频（mp4 / webm…）或弹幕（xml / json）');
    });

    // 转码进度/完成/失败事件（Rust 侧 ffmpeg 工作线程发出）
    T.event.listen('transcode://progress', function (ev) {
      var p = ev.payload || {};
      if (normPath(p.video) !== transcodeVideo) return;
      pillLabel = p.kind === 'subtitle' ? '字幕' : '音轨';
      updatePill(p.percent, p.written);
    });
    T.event.listen('transcode://done', function (ev) {
      var p = ev.payload || {};
      hidePill();
      if (normPath(p.video) !== transcodeVideo) {
        toast('「' + baseName(pathName(p.video)) + '」后台处理完成');
        return;
      }
      transcodeVideo = '';
      if (p.kind === 'subtitle') {
        var s = pendingSub;
        pendingSub = null;
        if (s && normPath(currentVideoPath) === normPath(p.video)) {
          mountSubtitleUrl(mediaUrl(p.out), s, false); // 正播这个文件：直接挂载抽取好的字幕
        }
      } else if (transcodeOrdinal > 0) {
        var ordinal = transcodeOrdinal;
        transcodeOrdinal = -1;
        engageExternalAudio(p.video, p.out, ordinal, false); // 正播这个文件：直接挂载外挂音频
      }
    });
    T.event.listen('transcode://error', function (ev) {
      var p = ev.payload || {};
      if (normPath(p.video) !== transcodeVideo) return;
      hidePill();
      transcodeVideo = '';
      transcodeOrdinal = -1;
      pendingSub = null;
      toast((p.kind === 'subtitle' ? '字幕抽取失败：' : '音轨转换失败：') + (p.message || '未知错误'), 8000);
    });

    renderPlaylist();
  }

  loadBlockConfig();
  bindBlockPanel();
  initDesktop();

  // 便于调试 / 自动化验证
  window.Bplayer = {
    get art() { return art; },
    get danmaku() { return danmakuList; },
    get queue() { return debugQueue; },
    get block() { return { enabled: blockState.enabled, words: blockWords().length }; },
    get filter() { return filterDanmaku; }
  };
})();
</script>
</body>
</html>
